x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file: .env
  environment:
    MONGODB_URI: mongodb://mongo:27017/ethica?directConnection=true
    # Arquivos do tenant (AD-120) no s3 (RustFS) deste compose.
    S3_ENDPOINT: http://s3:9000
    S3_BUCKET: ethica
    S3_ACCESS_KEY_ID: ethica
    S3_SECRET_ACCESS_KEY: ethica-dev-secret
  depends_on:
    mongo:
      condition: service_healthy
    s3-init:
      condition: service_completed_successfully
  volumes:
    - .:/app
    - /app/node_modules
    - /app/apps/api/node_modules
    - /app/apps/web/node_modules
    - /app/packages/contracts/node_modules
    - /app/packages/db/node_modules
    - /app/packages/ui/node_modules

services:
  # Atlas Local (Atlas Search). Porta do host 37017 para não colidir com um Mongo na 27017.
  mongo:
    image: mongodb/mongodb-atlas-local:8
    container_name: ethica-mongo
    restart: unless-stopped
    ports:
      - '37017:27017'
    volumes:
      - mongo-atlas-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Storage S3 compatível (AD-120): RustFS, porque as imagens públicas do MinIO saíram do
  # Docker Hub. Console em http://localhost:19001 (ethica / ethica-dev-secret).
  s3:
    image: rustfs/rustfs:1.0.1
    container_name: ethica-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ethica
      RUSTFS_SECRET_KEY: ethica-dev-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '19000:9000'
      - '19001:9001'
    volumes:
      - s3-data:/data

  # Cria o bucket privado `ethica` uma vez (idempotente), tentando até o s3 responder.
  s3-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ethica
      AWS_SECRET_ACCESS_KEY: ethica-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "for i in $$(seq 1 30); do
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket ethica 2>/dev/null && exit 0;
      aws --endpoint-url http://s3:9000 s3 mb s3://ethica && exit 0;
      sleep 2; done; exit 1"

  api:
    <<: *app
    container_name: ethica-api
    working_dir: /app/apps/api
    # Chama o tsx direto (em vez de `pnpm run dev`) — o `pnpm --filter` faz um
    # check de deps a cada start que quebra com "disk I/O error" no índice
    # sqlite do store quando /app é bind mount (Docker Desktop no macOS).
    command: /app/node_modules/.bin/tsx watch src/server.ts
    ports:
      - '18080:18080'

  web:
    <<: *app
    container_name: ethica-web
    working_dir: /app/apps/web
    # Caminho local a apps/web: `vite` é dependência direta só de apps/web, então
    # o bin da raiz não é garantido entre reinstalls.
    command: /app/apps/web/node_modules/.bin/vite --host 0.0.0.0
    depends_on:
      - api
    ports:
      - '15173:15173'

volumes:
  mongo-atlas-data:
  s3-data:
