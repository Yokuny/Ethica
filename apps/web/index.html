<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f7f7" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/geist/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Ethica</title>
    <!-- O tema visual é sempre claro. Só o tamanho do texto salvo pelo usuário
         precisa ser aplicado antes do React para evitar mudança de escala
         durante o primeiro paint. -->
    <script>
      (() => {
        document.documentElement.classList.remove('dark');
        try {
          const textSize = localStorage.getItem('text-size');
          if (textSize === 'sm' || textSize === 'lg') document.documentElement.setAttribute('data-text-size', textSize);
        } catch {
          // Sem storage: mantém a escala padrão até o React montar.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
